<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ふたりのカレンダー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">ふたりのカレンダー</h1>
      <span id="conn" class="conn" title="接続を確認中"></span>
      <button id="open-settings" class="btn-icon" type="button" aria-label="設定">⚙</button>
    </header>

    <div class="toolbar">
      <div class="month-label">
        <span id="year" class="year"></span>
        <span id="month" class="month"></span>
      </div>
      <div class="nav">
        <button id="today" class="btn-today" type="button">今日</button>
        <button id="prev" class="btn-nav" type="button" aria-label="前の月">‹</button>
        <button id="next" class="btn-nav" type="button" aria-label="次の月">›</button>
      </div>
    </div>

    <div id="weekdays" class="weekdays"></div>
    <div id="grid" class="grid"></div>

    <div class="legend">
      <span class="legend-item"><i class="dot dot--me"></i>自分</span>
      <span class="legend-item"><i class="dot dot--you"></i>相手</span>
    </div>
  </div>

  <!-- 日別シート（予定の確認・追加） -->
  <div id="day-sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="day-title"></h2>
        <button class="btn-icon" type="button" data-close aria-label="閉じる">✕</button>
      </div>

      <ul id="day-list" class="day-list"></ul>

      <form id="add-form" class="add-form">
        <div class="owner-toggle">
          <button type="button" class="owner-btn owner-btn--me is-active" data-owner="me">自分</button>
          <button type="button" class="owner-btn owner-btn--you" data-owner="partner">相手</button>
        </div>
        <input id="ev-title" class="ev-input" type="text" placeholder="予定（例：仕事、デート）" required>
        <div class="add-row">
          <input id="ev-time" class="ev-input ev-time" type="time">
          <span class="add-hint">時刻なし＝終日</span>
          <button type="submit" class="btn-add">追加</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 設定画面 -->
  <div id="settings" class="settings" hidden>
    <div class="settings-panel">
      <div class="settings-head">
        <button id="close-settings" class="btn-icon" type="button" aria-label="閉じる">✕</button>
        <h2>設定</h2>
      </div>

      <section class="settings-section">
        <h3>月の移動</h3>
        <p class="settings-desc">カレンダーをスワイプして月を切り替える向きを選べます。</p>
        <label class="opt">
          <input type="radio" name="swipeAxis" value="horizontal">
          <span class="opt-label">左右スワイプで月を移動</span>
          <span class="opt-check"></span>
        </label>
        <label class="opt">
          <input type="radio" name="swipeAxis" value="vertical">
          <span class="opt-label">上下スワイプで月を移動</span>
          <span class="opt-check"></span>
        </label>
      </section>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
